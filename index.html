<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f3"><title>冠群工厂宣传片｜协作待办</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f5f3;--ink:#171717;--muted:#777;--line:#e8e8e5;--green:#16865b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:1000px;margin:auto;padding:38px 20px}header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:24px}h1{font-size:clamp(26px,4vw,38px);margin:5px 0;letter-spacing:-.04em}.muted{color:var(--muted);font-size:12px}.pill,.btn,input{border:1px solid var(--line);border-radius:12px;background:white;padding:10px 13px}.pill{font-size:12px}.panel,.section{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.auth{display:flex;gap:8px;flex-wrap:wrap}.auth input{flex:1;min-width:210px}.btn{cursor:pointer}.primary{background:#202020;color:white}.stats{display:flex;gap:18px;color:var(--muted);font-size:12px}.stats strong{color:var(--ink)}.percent{font-size:30px;font-weight:700}.bar{height:8px;background:#eee;border-radius:9px;margin-top:12px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green);width:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar input{flex:1;min-width:180px}.filter.active{background:#202020;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section{padding:0;overflow:hidden}.head{padding:15px;display:flex;justify-content:space-between;cursor:pointer;font-weight:650}.items{padding:0 15px 12px}.section.closed .items{display:none}.task{display:flex;gap:10px;padding:10px 0;border-top:1px solid #f0f0ee;font-size:13px}.task input{padding:0;margin:2px 0 0;width:17px;height:17px;flex:none;accent-color:#202020}.task small{display:block;color:var(--muted);font-size:11px}.task.done span{text-decoration:line-through;color:#999}.empty{display:none;text-align:center;padding:30px;color:#888}.note{margin-top:18px;background:#eeeee9;border-radius:16px;padding:17px;font-size:12px}.status{font-size:12px;margin-top:10px;color:#777}.status.err{color:#b54737}.status.ok{color:#16865b}@media(max-width:680px){.wrap{padding:25px 13px}.grid{grid-template-columns:1fr}header{display:block}.pill{display:inline-block;margin-top:10px}}@media print{.auth,.toolbar,.pill{display:none}.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap">
<header><div><div class="muted">TEAM CHECKLIST · 2026</div><h1>冠群工厂宣传片</h1><div class="muted">多人协作拍摄执行清单 · 勾选状态实时同步</div></div><div class="pill" id="conn">等待连接</div></header>
<section class="panel"><b>团队成员登录</b><div class="auth" style="margin-top:12px"><input id="email" type="email" placeholder="输入管理员邀请的团队邮箱"><button class="btn primary" id="login">发送登录链接</button><button class="btn" id="logout" hidden>退出登录</button></div><div class="muted" style="margin-top:8px">仅限已邀请成员。登录链接将发送至邮箱。</div><div class="status" id="status">请先登录以访问团队清单。</div></section>
<section class="panel"><div style="display:flex;justify-content:space-between;align-items:end"><div><div class="muted">团队整体执行进度</div><div class="stats"><span><strong id="done">0</strong> 已完成</span><span><strong id="left">0</strong> 待完成</span><span><strong id="total">0</strong> 总任务</span></div></div><div class="percent" id="pct">0%</div></div><div class="bar"><span id="bar"></span></div></section>
<div class="toolbar"><input id="search" placeholder="搜索任务或拍摄内容…"><button class="btn filter active" data-f="all">全部</button><button class="btn filter" data-f="todo">待完成</button><button class="btn filter" data-f="done">已完成</button><button class="btn" id="expand">全部展开</button><button class="btn" onclick="print()">打印</button></div>
<main class="grid" id="list"></main><div class="empty" id="empty">没有匹配的任务</div>
<div class="note"><b>现场拍摄重点</b><p>过热缩膜工序：重点突出　·　自动化设备：优先拍摄机器　·　MES系统：真实操作演示　·　照片留档：每场地4–5张</p></div>
</div>
<script>
/* 发布前由管理员填入 Supabase 项目 URL 与 anon/publishable key。禁止使用 service_role key。 */
const SUPABASE_URL="YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY";
const sections=[
["01 / 工厂实景与生产流程",[["工厂航拍","工厂整体外观、厂区环境"],["前台","前台及企业形象"],["5楼物料","物料区域及物料管理"],["仓库","仓库整体环境"],["生产线全流程","完整呈现生产各环节"],["自动化机器","重点拍摄自动化设备运行"],["多生产线","不同生产线的整体及细节"],["MES系统","MES系统实际运行画面"]]],
["02 / 实验室",[["实验室全景","展示实验室整体环境"],["防摔测试","产品防摔测试过程"],["防尘测试","产品防尘测试过程"],["防水测试","产品防水测试过程"],["插拔测试","产品接口插拔测试过程"]]],
["03 / 包装打包",[["屏幕保护膜","机器贴屏幕保护膜过程"],["整机成品包装","产品完整包装过程"],["过热缩膜","重点强调过热缩膜工序"],["机器与物料","尽量多拍机器和物料，少拍人"]]],
["04 / 品牌及生产线素材准备",[["Ulefone产品线","准备生产线实拍素材"],["RugOne生产线","准备生产线实拍素材"],["行业设备生产线","准备无Logo的客户行业机器产线画面"],["行业设备辅助素材","商务办公主机、无品牌产品示例图等素材"],["行业订单能力展示","体现可承接手机、平板及行业设备订单的能力"]]],
["05 / MES系统演示准备",[["MES平板操作","拍摄工作人员使用平板操作MES系统"],["设备联动画面","展示MES系统与其他机器联通"],["扫码录入","拍摄扫码录入MES系统的过程"],["现场实拍","提前协调人员、设备及操作流程"]]],
["06 / 拍摄现场注意事项",[["环境清洁","画面保持干净无尘"],["清洁工具","准备抹布、手持吸尘器"],["设备清洁","拍摄前清理设备及周围空间"],["防静电服","员工规范穿着防静电服"],["手指套","组装机器时必须佩戴手指套"],["员工形象","优先选择年轻、中年且外表形象较好的员工"],["员工状态","避免拍摄长痘、痘痘明显的员工"],["自动化镜头","有自动化环节时，优先拍摄机器运行画面"],["仓库整理","拍摄前整理仓库环境"],["机器清洁","擦拭机器，避免灰尘及明显污点"]]],
["07 / 照片留档",[["每个拍摄场地","留存4–5张照片"],["人物照片","每个场地包含带人与不带人的照片"],["物料仓","拍摄仓库照片"],["电池仓","拍摄仓库照片"],["4料仓","拍摄仓库照片"],["包材仓","拍摄仓库照片"],["3楼成品仓","拍摄仓库照片"],["2楼成品仓","拍摄仓库照片"]]]
];
const tasks=sections.flatMap((s,i)=>s[1].map((x,j)=>({id:String(i+1).padStart(2,"0")+"-"+String(j+1).padStart(2,"0"),section:s[0],title:x[0],description:x[1]})));
let db=null,user=null,state={},filter="all",query="",channel=null;const $=x=>document.getElementById(x);
function status(t,c=""){ $("status").textContent=t;$("status").className="status "+c; }
function progress(){let n=tasks.length,d=Object.values(state).filter(x=>x.completed).length,p=Math.round(d/n*100);$("done").textContent=d;$("left").textContent=n-d;$("total").textContent=n;$("pct").textContent=p+"%";$("bar").style.width=p+"%";}
function render(){let list=$("list");list.innerHTML="";let visible=0;sections.forEach(s=>{let rows=tasks.filter(t=>t.section===s[0]),card=document.createElement("section");card.className="section";let d=rows.filter(t=>state[t.id]?.completed).length,head=document.createElement("div");head.className="head";head.innerHTML="<span>"+s[0]+"</span><small class='muted'>"+d+"/"+rows.length+"　⌄</small>";head.onclick=()=>card.classList.toggle("closed");let items=document.createElement("div");items.className="items";rows.forEach(t=>{let done=!!state[t.id]?.completed;if((filter==="todo"&&done)||(filter==="done"&&!done)||!((t.title+" "+t.description+" "+t.section).toLowerCase().includes(query)))return;visible++;let label=document.createElement("label");label.className="task"+(done?" done":"");let cb=document.createElement("input");cb.type="checkbox";cb.checked=done;cb.disabled=!user;cb.onchange=()=>toggle(t,cb);let text=document.createElement("span");text.textContent=t.title;let small=document.createElement("small");small.textContent=t.description;text.append(small);label.append(cb,text);items.append(label)});if(items.children.length){card.append(head,items);list.append(card)}});$("empty").style.display=visible?"none":"block";progress();}
async function load(){let {data,error}=await db.from("checklist_tasks").select("*");if(error)throw error;state={};data.forEach(x=>state[x.id]=x);render();}
async function toggle(t,cb){cb.disabled=true;let {data,error}=await db.from("checklist_tasks").update({completed:cb.checked,updated_at:new Date().toISOString(),updated_by:user.id}).eq("id",t.id).select().single();cb.disabled=false;if(error){status("保存失败："+error.message,"err");return;}state[t.id]=data;render();}
function realtime(){channel=db.channel("guan-qun-checklist").on("postgres_changes",{event:"*",schema:"public",table:"checklist_tasks"},p=>{if(p.new?.id){state[p.new.id]=p.new;render()}}).subscribe(s=>{if(s==="SUBSCRIBED")$("conn").textContent="实时同步已连接";});}
async function signedIn(u){user=u;$("email").hidden=true;$("login").hidden=true;$("logout").hidden=false;status("已登录："+u.email+"，正在同步…","ok");try{await load();realtime();status("团队清单已加载，成员勾选将自动同步。","ok")}catch(e){status("读取失败："+e.message+"。请检查 SQL 初始化与权限策略。","err")}}
async function init(){if(!SUPABASE_URL.startsWith("https://")||SUPABASE_ANON_KEY.includes("YOUR_")){$("conn").textContent="待配置云端";$("login").disabled=true;status("管理员尚未配置 Supabase URL 和公开 anon/publishable key。","err");return;}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let {data:{session}}=await db.auth.getSession();if(session)await signedIn(session.user);db.auth.onAuthStateChange((e,s)=>{if(s?.user&&!user)signedIn(s.user);if(!s){user=null;state={};render();$("conn").textContent="未登录";$("email").hidden=false;$("login").hidden=false;$("logout").hidden=true;}});}
$("login").onclick=async()=>{let email=$("email").value.trim();if(!email)return status("请填写邮箱。","err");let {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split("#")[0]}});status(error?"发送失败："+error.message:"登录链接已发送，请查收邮箱。",error?"err":"ok");};
$("logout").onclick=async()=>{await db.auth.signOut();if(channel)db.removeChannel(channel);channel=null;};
$("search").oninput=e=>{query=e.target.value.trim().toLowerCase();render();};document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});$("expand").onclick=()=>document.querySelectorAll(".section").forEach(x=>x.classList.remove("closed"));render();init();
</script></body></html>
